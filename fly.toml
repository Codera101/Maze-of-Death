app = 'maze-of-death'
primary_region = 'cdg'

[build]

# 1. TCP/HTTP Service (Socket.io & Web)
[[services]]
  protocol = "tcp"
  internal_port = 3000  # Changed from 8080 to match your code
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# 2. UDP Service (Geckos.io / Real-time Movement)
[[services]]
  protocol = "udp"
  internal_port = 3001  # Matches your WEBRTC_PORT
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 3001

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1